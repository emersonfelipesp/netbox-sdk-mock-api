name: Security Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]

jobs:
  changes:
    name: detect security test scope
    runs-on: ubuntu-latest
    outputs:
      run_all: ${{ steps.filter.outputs.run_all }}
      sdk: ${{ steps.filter.outputs.sdk }}
      cli: ${{ steps.filter.outputs.cli }}
      tui: ${{ steps.filter.outputs.tui }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            run_all:
              - 'pyproject.toml'
              - 'uv.lock'
              - 'tests/conftest.py'
              - '.github/workflows/security.yml'
            sdk:
              - 'netbox_sdk/**'
              - 'tests/test_security_sdk.py'
            cli:
              - 'netbox_cli/**'
              - 'netbox_sdk/services.py'
              - 'tests/test_security_cli.py'
            tui:
              - 'netbox_tui/**'
              - 'netbox_sdk/output_safety.py'
              - 'netbox_sdk/formatting.py'
              - 'tests/test_security_tui.py'

  security-sdk:
    name: sdk security / Python ${{ matrix.python-version }}
    needs: changes
    if: ${{ needs.changes.outputs.run_all == 'true' || needs.changes.outputs.sdk == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Sync development environment
        run: uv sync --dev --extra cli --extra tui --extra demo --locked

      - name: Run SDK security tests
        run: uv run pytest -v --tb=short -p no:randomly tests/test_security_sdk.py

  security-cli:
    name: cli security / Python ${{ matrix.python-version }}
    needs: changes
    if: ${{ needs.changes.outputs.run_all == 'true' || needs.changes.outputs.cli == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Sync development environment
        run: uv sync --dev --extra cli --extra tui --extra demo --locked

      - name: Run CLI security tests
        run: uv run pytest -v --tb=short -p no:randomly tests/test_security_cli.py

  security-tui:
    name: tui security / Python ${{ matrix.python-version }}
    needs: changes
    if: ${{ needs.changes.outputs.run_all == 'true' || needs.changes.outputs.tui == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v7

      - name: Sync development environment
        run: uv sync --dev --extra cli --extra tui --extra demo --locked

      - name: Run TUI security tests
        run: uv run pytest -v --tb=short -p no:randomly tests/test_security_tui.py

  security-summary:
    name: security quality
    if: ${{ always() }}
    needs: [changes, security-sdk, security-cli, security-tui]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all selected security matrices
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          RUN_ALL: ${{ needs.changes.outputs.run_all }}
          SDK: ${{ needs.changes.outputs.sdk }}
          CLI: ${{ needs.changes.outputs.cli }}
          TUI: ${{ needs.changes.outputs.tui }}
          SDK_RESULT: ${{ needs.security-sdk.result }}
          CLI_RESULT: ${{ needs.security-cli.result }}
          TUI_RESULT: ${{ needs.security-tui.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != success ]; then
            printf 'Scope selection must succeed, got %s\n' "$CHANGES_RESULT" >&2
            exit 1
          fi
          for value in "$RUN_ALL" "$SDK" "$CLI" "$TUI"; do
            case "$value" in
              true|false) ;;
              *) printf 'Invalid scope output: %s\n' "$value" >&2; exit 1 ;;
            esac
          done
          for value in "$SDK_RESULT" "$CLI_RESULT" "$TUI_RESULT"; do
            case "$value" in
              success|failure|cancelled|skipped) ;;
              *) printf 'Invalid native job result: %s\n' "$value" >&2; exit 1 ;;
            esac
          done
          for spec in "sdk:$SDK:$SDK_RESULT" "cli:$CLI:$CLI_RESULT" "tui:$TUI:$TUI_RESULT"; do
            IFS=: read -r scope selected result <<< "$spec"
            expected=skipped
            if [ "$RUN_ALL" = true ] || [ "$selected" = true ]; then
              expected=success
            fi
            if [ "$result" != "$expected" ]; then
              printf '%s matrix must be %s, got %s\n' "$scope" "$expected" "$result" >&2
              exit 1
            fi
          done
          printf 'All selected security matrices succeeded; only unselected matrices skipped.\n'
